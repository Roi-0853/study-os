<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study OS</title>
    <!-- chart.js (UMD) — node_modules'tan kopyalanan yerel dosya, global window.Chart sağlar -->
    <script src="/vendor/chart.umd.js" defer></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="main-container">
      <!-- SOL MENÜ -->
      <aside id="sidebar">
        <div class="logo-area">
          <span class="logo-text">Study-OS</span>
          <span class="logo-sub">v0.1</span>
        </div>
        <button class="nav-btn active">Main Page</button>
        <button id="addlesson" class="add-btn">+ Ders Ekle</button>
      </aside>

      <!-- ORTA ALAN -->
      <main id="dashboard">
        <h1 class="greeting">Hello, Boss</h1>

        <div class="clock-widget">
          <div class="clock-time">--:--</div>
          <div class="clock-date">---</div>
        </div>

        <section class="grid-section">
          <div class="grid-container"></div>
        </section>
      </main>

      <!-- SAĞ PANEL -->
      <aside id="right-panel">
        <h3>Çözülen soruların dağılımı</h3>
        <div class="radar-chart">
          <canvas id="radar-canvas"></canvas>
        </div>
      </aside>
    </div>

    <!-- Pencere Şablonu (body'nin içinde olmalı!) -->
    <template id="window-template">
      <div class="floating-window">
        <div class="window-titlebar">
          <span class="window-title">Pencere</span>
          <button class="window-close">✕</button>
        </div>
        <div class="window-content"></div>
      </div>
    </template>
  </body>
</html>
